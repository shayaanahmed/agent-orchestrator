name: agent-orchestrator

x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD:-orchestrator}@postgres:5432/${POSTGRES_DB:-orchestrator}
  OLLAMA_BASE_URL: http://model-gateway:8080/v1
  OLLAMA_API_TOKEN: ${MODEL_GATEWAY_TOKEN:-local-gateway-change-me}
  OLLAMA_PLANNER_MODEL: ${OLLAMA_PLANNER_MODEL:-qwen3:8b}
  OLLAMA_CODER_MODEL: ${OLLAMA_CODER_MODEL:-qwen2.5-coder:7b}
  OLLAMA_REVIEWER_MODEL: ${OLLAMA_REVIEWER_MODEL:-qwen3:8b}
  OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-qwen3:4b}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:8b}
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_TASK_QUEUE: project-execution
  USE_TEMPORAL: "true"
  ARTIFACT_DIRECTORY: /data/artifacts
  MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-2}
  SANDBOX_URL: http://sandbox-controller:8090
  SANDBOX_TOKEN: ${SANDBOX_TOKEN:-sandbox-change-me}
  SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-120}

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [edge, internal]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    expose: ["80"]
    networks: [internal]
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment: *app-environment
    volumes:
      - artifact_data:/data/artifacts
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
      sandbox-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/system/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal, sandbox-control]
    restart: unless-stopped

  orchestrator-worker:
    build:
      context: ../..
      dockerfile: services/orchestrator_worker/Dockerfile
    environment: *app-environment
    volumes:
      - artifact_data:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
      sandbox-controller:
        condition: service_healthy
    networks: [internal, sandbox-control]
    restart: unless-stopped

  sandbox-controller:
    build:
      context: ../..
      dockerfile: services/sandbox_controller/Dockerfile
    environment:
      ARTIFACT_DIRECTORY: /data/artifacts
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-sandbox-change-me}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-200000}
    volumes:
      - artifact_data:/data/artifacts
    expose: ["8090"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [sandbox-control]
    restart: unless-stopped

  model-gateway:
    build:
      context: ../..
      dockerfile: services/model_gateway/Dockerfile
    environment:
      UPSTREAM_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      UPSTREAM_OLLAMA_API_TOKEN: ${OLLAMA_API_TOKEN:-ollama}
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-local-gateway-change-me}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-600}
      MODEL_CONNECT_TIMEOUT_SECONDS: ${MODEL_CONNECT_TIMEOUT_SECONDS:-10}
    expose: ["8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 10s
    networks: [internal, model-egress]
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-orchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  temporal-postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "7233:7233"
    networks: [internal]
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.54.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${APP_PORT:-8088}
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [internal]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks: [internal]
    restart: unless-stopped

volumes:
  postgres_data:
  temporal_postgres_data:
  artifact_data:
  prometheus_data:
  grafana_data:

networks:
  edge:
  internal:
    internal: true
  model-egress:
  sandbox-control:
    internal: true
